name: Deploy to npm

on:
  push:
    branches:
      - master

permissions:
  contents: write
  id-token: write # required for npm trusted publishing (OIDC)

jobs:
  publish-npm:
    runs-on: ubuntu-latest

    steps:
      # Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Set up Node.js environment
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org/'

      # Trusted publishing requires npm >= 11.5.1
      - name: Update npm
        run: npm install -g npm@latest

      # Install dependencies
      - name: Install dependencies
        run: npm install

      # Get the short hash of the last commit
      - name: Get short commit hash
        id: get_hash
        run: echo "HASH=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      # Update the version in package.json
      - name: Update version
        id: update_version
        run: |
          BASE=$(jq -r .version package.json)
          VERSION="${BASE}.${HASH}"
          jq --arg ver "$VERSION" '.version = $ver' package.json > tmp.json && mv tmp.json package.json
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      # Build the package
      - name: Build package
        run: npm run make

      # Run tests
      - name: Run tests
        run: npx jest --coverage

      # Upload results to Codecov
      - name: Upload results to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      # Create Git tag
      - name: Create Git tag
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ env.VERSION }}
          git push origin ${{ env.VERSION }}

      # Create GitHub Release
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$VERSION" --title "Release $VERSION" --prerelease --notes ""

      # Publish to npm via trusted publishing (OIDC), no token needed.
      # npm >= 11 requires an explicit dist-tag for prerelease versions;
      # every release is an alpha, so keep publishing them as latest.
      - name: Publish to npm
        run: npm publish --access public --tag latest
